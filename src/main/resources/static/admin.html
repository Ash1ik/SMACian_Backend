<!DOCTYPE html>
<!--
  SMACian Admin Panel (testing tool, not production-hardened).
  Served by Spring Boot itself: http://localhost:8080/admin.html
  Same-origin API calls, JWT in sessionStorage. Every modifying call
  requires ROLE_ADMIN - the API enforces it, this page only hides buttons.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMACian Admin</title>
<style>
  :root { --bg: #0f172a; --card: #1e293b; --line: #334155; --txt: #e2e8f0;
          --dim: #94a3b8; --acc: #38bdf8; --ok: #34d399; --bad: #f87171; --warn: #fbbf24; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif;
         background: var(--bg); color: var(--txt); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  header .me { color: var(--dim); font-size: 13px; margin-right: 10px; }
  nav { display: flex; gap: 8px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  nav button { background: var(--card); color: var(--txt); border: 1px solid var(--line);
               padding: 8px 16px; border-radius: 8px; cursor: pointer; }
  nav button.on { border-color: var(--acc); color: var(--acc); }
  main { padding: 20px; max-width: 1000px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  .dim { color: var(--dim); font-size: 13px; }
  .pill { font-size: 12px; padding: 2px 10px; border-radius: 20px; border: 1px solid var(--line); }
  .pill.admin { color: var(--warn); border-color: var(--warn); }
  .pill.off { color: var(--bad); border-color: var(--bad); }
  .pill.open { color: var(--ok); border-color: var(--ok); }
  input, select, textarea { background: #0b1220; color: var(--txt); border: 1px solid var(--line);
                            border-radius: 8px; padding: 9px 12px; font-size: 14px; }
  textarea { width: 100%; min-height: 80px; resize: vertical; }
  button.act { background: #0b1220; color: var(--txt); border: 1px solid var(--line);
               padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
  button.act:hover { border-color: var(--acc); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button.go { background: var(--acc); color: #06202e; border: none; font-weight: 700;
              padding: 10px 22px; border-radius: 8px; cursor: pointer; }
  img.thumb { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  img.avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--line); }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
           background: #020617; border: 1px solid var(--acc); padding: 10px 20px;
           border-radius: 10px; display: none; max-width: 90vw; }
  #toast.err { border-color: var(--bad); }
  #login { max-width: 380px; margin: 8vh auto; }
  #login input { width: 100%; margin-bottom: 10px; }
  .hidden { display: none; }
  .replies { margin-left: 26px; border-left: 2px solid var(--line); padding-left: 10px; }
  .cmt { margin: 8px 0; font-size: 14px; }
  label.ck { display: flex; gap: 8px; align-items: center; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>SMACian Admin</h1>
  <div><span class="me hidden" id="meLine"></span><button class="act hidden" id="logoutBtn">Logout</button></div>
</header>

<!-- LOGIN -->
<div id="login">
  <div class="card">
    <h2 style="margin-top:0">Admin login</h2>
    <input id="liContact" placeholder="Email or phone" autocomplete="username">
    <input id="liPass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="go" id="loginBtn" style="width:100%">Login</button>
    <p class="dim">Needs an ADMIN account. JWT stays in this tab only.</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <nav>
    <button data-tab="users" class="on">Users</button>
    <button data-tab="feed">Feed</button>
    <button data-tab="blood">Blood requests</button>
    <button data-tab="cast">Broadcast</button>
  </nav>
  <main>
    <section id="tab-users">
      <div class="card row">
        <input id="uSearch" class="grow" placeholder="Search name or designation...">
        <select id="uBlood">
          <option value="">All blood groups</option>
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
        </select>
        <button class="go" id="uGo">Search</button>
      </div>
      <div id="uList"></div>
    </section>

    <section id="tab-feed" class="hidden">
      <div class="card row"><span class="dim">Latest 20 posts (newest first). Open comments to moderate them.</span>
        <button class="go" id="fGo">Refresh</button></div>
      <div id="fList"></div>
    </section>

    <section id="tab-blood" class="hidden">
      <div class="card row">
        <select id="bStatus">
          <option value="OPEN">OPEN</option><option value="FULFILLED">FULFILLED</option>
          <option value="CANCELLED">CANCELLED</option><option value="EXPIRED">EXPIRED</option>
          <option value="">ALL</option>
        </select>
        <button class="go" id="bGo">Load</button>
      </div>
      <div id="bList"></div>
    </section>

    <section id="tab-cast" class="hidden">
      <div class="card">
        <h3 style="margin-top:0">Broadcast to every active user</h3>
        <input id="cTitle" class="grow" style="width:100%;margin-bottom:10px" maxlength="200" placeholder="Title (max 200)">
        <textarea id="cBody" maxlength="500" placeholder="Message (max 500)"></textarea>
        <div class="row" style="margin-top:10px">
          <label class="ck"><input type="checkbox" id="cPush" checked> Send instant push too</label>
          <button class="go" id="cGo">Send broadcast</button>
        </div>
      </div>
    </section>
  </main>
</div>

<div id="toast"></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const token = () => sessionStorage.getItem("smacian_jwt") || "";
function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = err ? "err" : "";
  t.style.display = "block"; clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = "none", 3500);
}
async function api(method, path, body) {
  const opt = { method, headers: { "Authorization": "Bearer " + token() } };
  if (body !== undefined) { opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  if (r.status === 401) { logout(); throw new Error("Session expired - logged out"); }
  if (r.status === 403) throw new Error("Admin only");
  if (r.status === 204) return null;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((j && j.message) || ("HTTP " + r.status));
  return j;
}
function logout() {
  sessionStorage.removeItem("smacian_jwt");
  $("app").classList.add("hidden"); $("login").classList.remove("hidden");
  $("logoutBtn").classList.add("hidden"); $("meLine").classList.add("hidden");
}
function fmtDate(s) { try { return new Date(s).toLocaleString(); } catch (e) { return esc(s); } }

/* ---------- login ---------- */
$("loginBtn").onclick = async () => {
  try {
    const r = await fetch("/api/auth/login", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contact: $("liContact").value.trim(), password: $("liPass").value }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.message || ("HTTP " + r.status));
    sessionStorage.setItem("smacian_jwt", j.token);
    const me = await api("GET", "/api/user/profile");
    if (me.role !== "ADMIN") { logout(); toast("This account is not an admin", true); return; }
    $("meLine").textContent = me.firstName + " " + me.lastName + " (ADMIN)";
    $("meLine").classList.remove("hidden"); $("logoutBtn").classList.remove("hidden");
    $("login").classList.add("hidden"); $("app").classList.remove("hidden");
    loadUsers();
  } catch (e) { toast(e.message, true); }
};
$("logoutBtn").onclick = logout;
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  ["users", "feed", "blood", "cast"].forEach(t => $("tab-" + t).classList.toggle("hidden", t !== b.dataset.tab));
});

/* ---------- users ---------- */
async function loadUsers() {
  try {
    const q = "&search=" + encodeURIComponent($("uSearch").value.trim()) +
              "&bloodGroup=" + encodeURIComponent($("uBlood").value);
    const p = await api("GET", "/api/users?size=20" + q);
    $("uList").innerHTML = p.content.map(u =>
      `<div class="card"><div class="row">
        ${u.profilePhotoUrl ? `<img class="avatar" src="${esc(u.profilePhotoUrl)}" loading="lazy">` : ""}
        <div class="grow"><b>${esc(u.fullName)}</b>
          <span class="pill${u.bloodGroup ? "" : " hidden"}">${esc(u.bloodGroup || "")}</span>
          <div class="dim">#${u.id} · ${esc(u.designation || "no designation")}</div></div>
        <button class="act" onclick="toggleActive(${u.id})">On/Off</button>
        <button class="act" onclick="toggleRole(${u.id})">Admin?</button>
      </div></div>`).join("") || `<div class="card dim">No users found.</div>`;
  } catch (e) { toast(e.message, true); }
}
window.toggleActive = async (id) => {
  // List rows don't carry isActive: OK = activate, Cancel = deactivate.
  const to = confirm("Press OK to ACTIVATE, Cancel to DEACTIVATE user #" + id + "?");
  try {
    const r = await api("PATCH", "/api/admin/users/" + id + "/active", { active: to });
    toast(r.message); loadUsers();
  } catch (e) { toast(e.message, true); }
};
window.toggleRole = async (id) => {
  const toAdmin = confirm("Press OK to make user #" + id + " ADMIN, Cancel to demote to USER.");
  try {
    const r = await api("PATCH", "/api/admin/users/" + id + "/role", { role: toAdmin ? "ADMIN" : "USER" });
    toast(r.message); loadUsers();
  } catch (e) { toast(e.message, true); }
};
$("uGo").onclick = loadUsers;

/* ---------- feed ---------- */
$("fGo").onclick = loadFeed;
async function loadFeed() {
  try {
    const p = await api("GET", "/api/feed?size=20");
    $("fList").innerHTML = p.content.map(o => {
      const s = o.sharedPost
        ? `<div class="dim">↪ reshared: <b>${esc(s.authorName)}</b> — ${esc((s.content || "").slice(0, 80))}</div>` : "";
      const imgs = (o.images || []).map(i =>
        `<a href="${esc(i.url)}" target="_blank"><img class="thumb" src="${esc(i.url)}" loading="lazy"></a>`).join("");
      return `<div class="card">
        <div class="row"><b>${esc(o.authorName)}</b>
          <span class="dim">#${o.id} · ♥${o.likeCount} 💬${o.commentCount} ↗${o.shareCount} · ${fmtDate(o.createdAt)}</span></div>
        <div>${esc(o.content || "")}</div>${s}<div class="row">${imgs}</div>
        <div class="row" style="margin-top:8px">
          <button class="act" onclick="loadComments(${o.id}, this)">Comments</button>
          <button class="act danger" onclick="delPost(${o.id})">Delete post</button>
        </div><div id="cm-${o.id}"></div></div>`;
    }).join("") || `<div class="card dim">No posts.</div>`;
  } catch (e) { toast(e.message, true); }
}
window.delPost = async (id) => {
  if (!confirm("Delete post #" + id + " (and its likes/comments/images)?")) return;
  try { await api("DELETE", "/api/feed/" + id); toast("Post deleted"); loadFeed(); }
  catch (e) { toast(e.message, true); }
};
async function renderComments(list) {
  return (await Promise.all(list.map(async c => {
    const kids = c.replies && c.replies.length ? await renderComments(c.replies) : "";
    return `<div class="cmt"><b>${esc(c.authorName)}</b>
      <span class="dim">♥${c.likeCount}</span> — ${esc(c.content)}
      <button class="act danger" onclick="delComment(${c.id})">del</button>
      <div class="replies">${kids}</div></div>`;
  }))).join("");
}
window.loadComments = async (postId, btn) => {
  const box = $("cm-" + postId);
  if (box.dataset.open) { box.innerHTML = ""; delete box.dataset.open; return; }
  try {
    const list = await api("GET", "/api/feed/" + postId + "/comments");
    box.innerHTML = await renderComments(list) || `<div class="dim">No comments.</div>`;
    box.dataset.open = "1";
  } catch (e) { toast(e.message, true); }
};
window.delComment = async (id) => {
  if (!confirm("Delete comment #" + id + " (+replies, +likes)?")) return;
  try { await api("DELETE", "/api/feed/comments/" + id); toast("Comment deleted"); loadFeed(); }
  catch (e) { toast(e.message, true); }
};

/* ---------- blood ---------- */
$("bGo").onclick = loadBlood;
async function loadBlood() {
  try {
    const p = await api("GET", "/api/blood-requests?status=" + encodeURIComponent($("bStatus").value) + "&size=20");
    $("bList").innerHTML = p.content.map(o =>
      `<div class="card"><div class="row">
        <span class="pill open">${esc(o.bloodGroup)}</span><b>${o.bags} bag(s)</b>
        <span class="pill">${esc(o.urgency)}</span><span class="pill">${esc(o.status)}</span>
        <span class="dim">#${o.id} · ${esc(o.requesterName)} · need by ${esc(o.neededBy)}</span></div>
        <div>${esc(o.hospital)} — ${esc(o.location)}</div>
        <div class="dim">${esc(o.contactNumber)}${o.note ? " · " + esc(o.note) : ""}</div>
        <div class="row" style="margin-top:8px">
          <button class="act danger" onclick="delBlood(${o.id})">Delete request</button>
        </div></div>`).join("") || `<div class="card dim">No requests.</div>`;
  } catch (e) { toast(e.message, true); }
}
window.delBlood = async (id) => {
  if (!confirm("Delete blood request #" + id + "?")) return;
  try { await api("DELETE", "/api/admin/blood-requests/" + id); toast("Request deleted"); loadBlood(); }
  catch (e) { toast(e.message, true); }
};

/* ---------- broadcast ---------- */
$("cGo").onclick = async () => {
  try {
    const r = await api("POST", "/api/admin/broadcast",
      { title: $("cTitle").value, body: $("cBody").value, push: $("cPush").checked });
    toast(r.message); $("cTitle").value = ""; $("cBody").value = "";
  } catch (e) { toast(e.message, true); }
};
</script>
</body>
</html>
