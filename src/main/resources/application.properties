# ============================================================
# SMACian Backend - Main Application Configuration
# ============================================================
# This file contains all configuration for our application:
#   - PostgreSQL database connection details
#   - JWT (login token) settings
#   - Cloudinary (image storage) settings
#   - File upload limits
#
# IMPORTANT: Never put real passwords/keys here.
# Use environment variables like ${DB_PASSWORD} instead.
#
# ============================================================
# Spring Boot Application
# ============================================================
spring.application.name=SMACian_Backend

# ============================================================
# Database Configuration (PostgreSQL)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smacian}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# HikariCP - small explicit pool. Hosted Postgres (Supabase pooler) has
# limited connections; 10 max keeps one app instance polite.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=600000
# Disable PostgreSQL server-side prepared statements (pgJDBC defaults to them
# after 5 executions per connection). A pooled connection that previously
# errored mid-protocol can otherwise fail later checkouts with
# 'ERROR: prepared statement "S_N" already exists', which surfaces in the app
# as a bogus 401 + logout. Client-side preparation avoids the whole class.
spring.datasource.hikari.data-source-properties.prepareThreshold=0


# ============================================================
# JPA Configuration
# ============================================================
# update   = create tables automatically if they don't exist (great for learning)
# validate = only checks that tables exist (safer for production)
spring.jpa.hibernate.ddl-auto=update
# Formats SQL queries nicely so they are easy to read in the console.
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ============================================================
# File Upload Limits
# ============================================================
# Maximum size of a single uploaded file. 10MB fits real phone-camera
# originals (3-10MB JPEGs); STORED bytes are smaller (server downscales to
# 1600px + recompresses before saving).
spring.servlet.multipart.max-file-size=10MB
# Maximum total request size. Must fit the biggest legal post: 5 images x
# 10MB + multipart overhead ~= 55MB (smaller totals pass; stored << this).
spring.servlet.multipart.max-request-size=55MB

# ============================================================
# JWT (Login Token) Configuration
# ============================================================
# This secret signs our JWT tokens.
# It must be at least 32 characters long for HS256.
# REQUIRED in every environment (no fallback - the app fails fast at
# startup if JWT_SECRET is missing, instead of signing with a default).
app.jwt.secret=${JWT_SECRET}
# How long the JWT token stays valid (milliseconds). 86400000 ms = 24 hours.
app.jwt.expiration-ms=86400000

# ============================================================
# Cloudinary (Free Image Storage)
# ============================================================
# Get these values free from https://cloudinary.com/
# Only the default-avatar URL builder uses Cloudinary today (no uploads).
# The old committed secret is burned - ROTATE it in the Cloudinary
# dashboard; these placeholders only satisfy bean construction.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:SMACian}
cloudinary.api-key=${CLOUDINARY_API_KEY:000000000000000}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:rotate-me-in-cloudinary-dashboard}

# ============================================================
# Brevo Email (OTP delivery)
# ============================================================
# Free at https://www.brevo.com -> SMTP & API -> API Keys.
# Never commit the real key - put it in Render env vars (and local .env) instead.
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:ashikiqbal.nitercse@gmail.com}

# ============================================================
# Server Configuration
# ============================================================
server.port=${PORT:8080}
# never = Spring's fallback error pages never echo exception text
# (our GlobalExceptionHandler already builds clean ErrorResponse JSON).
server.error.include-message=never

# ============================================================
# Logging
# ============================================================
# SQL statement logging is OFF (was debug): full query text in prod logs
# costs disk and can leak PII. Re-enable locally with:
#   logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework.security=warn
# Trust the X-Forwarded-* headers Render's proxy sends so absolute
# photo URLs (ServletUriComponentsBuilder / serveUri) build the real
# public https host instead of localhost:8080.
server.forward-headers-strategy=framework

# ============================================================
# Actuator (health checks for hosts like Koyeb/Render/Railway)
# ============================================================
# Only health+info are exposed; /actuator/health is permitAll in
# SecurityConfig. Everything else under /actuator stays authenticated.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
