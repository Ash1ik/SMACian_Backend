# ============================================================
# SMACian Backend - Main Application Configuration
# ============================================================
# This file contains all configuration for our application:
#   - PostgreSQL database connection details
#   - JWT (login token) settings
#   - Cloudinary (image storage) settings
#   - File upload limits
#
# IMPORTANT: Never put real passwords/keys here.
# Use environment variables like ${DB_PASSWORD} instead.
#
# ============================================================
# Spring Boot Application
# ============================================================
spring.application.name=SMACian_Backend

# ============================================================
# Database Configuration (PostgreSQL)
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smacian}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}


# ============================================================
# JPA Configuration
# ============================================================
# update   = create tables automatically if they don't exist (great for learning)
# validate = only checks that tables exist (safer for production)
spring.jpa.hibernate.ddl-auto=update
# Formats SQL queries nicely so they are easy to read in the console.
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ============================================================
# File Upload Limits
# ============================================================
# Maximum size of a single uploaded file (profile photo, cover photo).
spring.servlet.multipart.max-file-size=5MB
# Maximum total request size (for multiple files in one request).
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# JWT (Login Token) Configuration
# ============================================================
# This secret signs our JWT tokens.
# It must be at least 32 characters long for HS256.
# CHANGE THIS in production! Put it in your .env file.
app.jwt.secret=${JWT_SECRET:ChangeThisSecretInProductionToAReallyLongRandomString123!}
# How long the JWT token stays valid (milliseconds). 86400000 ms = 24 hours.
app.jwt.expiration-ms=86400000

# ============================================================
# Cloudinary (Free Image Storage)
# ============================================================
# Get these values free from https://cloudinary.com/
# Put the real values in your .env file, NOT here.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:SMACian}
cloudinary.api-key=${CLOUDINARY_API_KEY:924857392124117}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:huGGZ_BCNUsqtRWp2yOoUCCqg14}

# ============================================================
# Brevo Email (OTP delivery)
# ============================================================
# Free at https://www.brevo.com -> SMTP & API -> API Keys.
# Never commit the real key - put it in Render env vars (and local .env) instead.
brevo.api-key=${BREVO_API_KEY:}
brevo.sender-email=${BREVO_SENDER_EMAIL:ashikiqbal.nitercse@gmail.com}

# ============================================================
# Server Configuration
# ============================================================
server.port=${PORT:8080}
server.error.include-message=always

# ============================================================
# Logging
# ============================================================
logging.level.org.hibernate.SQL=debug
logging.level.org.springframework.security=warn
# Trust the X-Forwarded-* headers Render's proxy sends so absolute
# photo URLs (ServletUriComponentsBuilder / serveUri) build the real
# public https host instead of localhost:8080.
server.forward-headers-strategy=framework
